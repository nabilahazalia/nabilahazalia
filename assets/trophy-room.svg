<svg xmlns="http://www.w3.org/2000/svg" width="900" height="150" viewBox="0 0 900 150" role="img" aria-labelledby="title desc">
  <title id="title">Nabilah's Trophy Room</title>
  <desc id="desc">Three pastel idol-style achievement badges celebrating profile debut, coding sparkle, and dream building.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop stop-color="#fff0f3"/>
      <stop offset=".5" stop-color="#fff8fa"/>
      <stop offset="1" stop-color="#fff0f3"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#d16b86" flood-opacity=".18"/>
    </filter>
  </defs>
  <rect width="900" height="150" rx="22" fill="url(#bg)"/>
  <g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle" filter="url(#shadow)">
    <g transform="translate(150 20)">
      <circle cx="0" cy="42" r="38" fill="#ffd1dc" stroke="#ff9eaa" stroke-width="3"/>
      <text y="54" font-size="34">★</text>
      <text y="101" fill="#b84f6a" font-size="16" font-weight="700">PROFILE DEBUT</text>
      <text y="120" fill="#d16b86" font-size="12">the stage is set</text>
    </g>
    <g transform="translate(450 20)">
      <circle cx="0" cy="42" r="38" fill="#ffe4ec" stroke="#ff9eaa" stroke-width="3"/>
      <text y="54" font-size="34">✦</text>
      <text y="101" fill="#b84f6a" font-size="16" font-weight="700">CODE SPARKLE</text>
      <text y="120" fill="#d16b86" font-size="12">commits with heart</text>
    </g>
    <g transform="translate(750 20)">
      <circle cx="0" cy="42" r="38" fill="#ffd1dc" stroke="#ff9eaa" stroke-width="3"/>
      <text y="54" font-size="34">♥</text>
      <text y="101" fill="#b84f6a" font-size="16" font-weight="700">DREAM BUILDER</text>
      <text y="120" fill="#d16b86" font-size="12">creating with purpose</text>
    </g>
  </g>
</svg>
